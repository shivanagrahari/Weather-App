
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Weather Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="weather-container">

        <header class="header">
            <h1>☀️ Weather Dashboard</h1>
            <p>Check real-time weather of any city</p>
        </header>

        <section class="search-section">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                autocomplete="off"
            >

            <button id="searchBtn">Search</button>
        </section>

        <p id="message" role="status" aria-live="polite"></p>

        <div id="weatherContent" hidden>

            <section class="current-weather">

                <div class="location">
                    <h2 id="cityName">City</h2>
                    <p id="currentDate"></p>
                </div>

                <div class="weather-main">
                    <div id="weatherIcon" class="weather-icon">☀️</div>

                    <div>
                        <h2 id="temperature">--°C</h2>
                        <p id="weatherDescription">Weather</p>
                    </div>
                </div>

                <div class="weather-details">

                    <div class="detail">
                        <span>Feels Like</span>
                        <strong id="feelsLike">--°C</strong>
                    </div>

                    <div class="detail">
                        <span>Humidity</span>
                        <strong id="humidity">--%</strong>
                    </div>

                    <div class="detail">
                        <span>Wind Speed</span>
                        <strong id="windSpeed">-- km/h</strong>
                    </div>

                </div>

            </section>

            <section class="forecast-section">
                <h2>5-Day Weather Forecast</h2>

                <div id="forecastContainer" class="forecast-container"></div>
            </section>

        </div>

        <footer>
            <p>Weather data powered by Open-Meteo</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
